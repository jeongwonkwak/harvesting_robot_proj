dataset_repo_id: /data/vla/fin/smolvla_dataset_v1.0.0
job_name: smolvla_sft_v.0.1.0

# 학습 설정
n_epochs: 10
batch_size: 8
save_freq: 200       # 체크포인트 저장 주기 (스텝)
log_freq: 50         # 로그 출력 주기 (스텝)
seed: 1000
num_workers: 4

# 옵티마이저
lr: 5e-5
weight_decay: 1e-10
grad_clip_norm: 10.0

# 스케줄러
warmup_steps: 100
decay_lr: 2.5e-6

# 모델
base_model_path: /models/public/smolvla_base                          # lerobot SmolVLA 베이스 체크포인트
vlm_model_name: /models/public/SmolVLM2-500M-Video-Instruct           # VLM 백본 경로 (HF hub ID 또는 로컬 경로)
freeze_vision_encoder: true   # vision encoder 고정 여부
chunk_size: 50                # action chunk 크기
